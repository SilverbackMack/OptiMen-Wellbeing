name: Build logo files

on:
  push:
    branches: [main]
    paths:
      - brand/generate.py
      - .github/workflows/brand.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libcairo2
      - run: pip install -q "uharfbuzz>=0.39" fonttools cairosvg
      - name: Generate
        run: |
          python brand/generate.py > gen.log 2>&1 || { tail -20 gen.log | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
          cat gen.log
      - name: Commit files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brand/out
          git diff --cached --quiet || git commit -m "Update logo files [skip ci]"
          git push
