name: Publish website

on:
  push:
    branches: [main]
    paths-ignore:
      - 'brand/**'
      - '.github/workflows/brand.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund > install.log 2>&1 || {
            grep -E "ERR|error" install.log | tail -15 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
      - name: Build
        run: |
          npm run build > build.log 2>&1 || {
            tail -15 build.log | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
