name: Publish website

on:
  push:
    branches: [main]
    paths-ignore:
      - 'brand/**'
      - '.github/workflows/brand.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 0 * * *'  # daily rebuild so scheduled articles go live

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund > install.log 2>&1 || {
            grep -E "ERR|error" install.log | tail -15 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
      - name: Build
        run: |
          npm run build > build.log 2>&1 || {
            tail -15 build.log | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
      - name: Check generated pages
        run: |
          echo "::notice::$(grep Prerendered build.log) | sitemap URLs: $(grep -c '<loc>' dist/sitemap.xml)"
          for f in dist/articles/*/index.html dist/reviews/*/index.html; do echo "::notice::$f -> $(grep -o '<h1>[^<]*</h1>' $f | head -1) | $(grep -o '<h2>' $f | wc -l) headings"; done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
